<svg xmlns="http://www.w3.org/2000/svg" width="900" height="235" viewBox="0 0 900 235" role="img" aria-label="CONNECT.SH // OPEN CHANNEL">
<defs>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#42f58d" stop-opacity=".2"/><stop offset=".5" stop-color="#b5ff70" stop-opacity=".9"/><stop offset="1" stop-color="#42f58d" stop-opacity=".2"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#42f58d" stroke-opacity=".045" stroke-width="1"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    .title{fill:#d9f8e5;font-size:19px;font-weight:700;letter-spacing:1.5px}
    .label{fill:#8aa995;font-size:12px;letter-spacing:1px}
    .value{fill:#d9f8e5;font-size:16px;font-weight:600}
    .accent{fill:#42f58d}
    .enter{opacity:0;animation:enter .75s cubic-bezier(.2,.8,.2,1) forwards}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .scan{animation:scan 5s linear infinite}
    @keyframes enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(235px)}}
    @media(prefers-reduced-motion:reduce){.enter,.pulse,.scan{animation:none;opacity:1}}
  </style>
</defs>
<rect x="1" y="1" width="898" height="233" rx="15" fill="#07110d" stroke="#1c4a30" stroke-width="2"/>
<rect x="2" y="2" width="896" height="231" rx="14" fill="url(#grid)"/>
<rect x="2" y="2" width="896" height="3" rx="2" fill="url(#edge)"/>
<circle cx="28" cy="27" r="5" fill="#ff6b6b"/><circle cx="47" cy="27" r="5" fill="#ffd166"/><circle cx="66" cy="27" r="5" fill="#42f58d"/>
<text x="88" y="32" class="label">THORSEN // PUBLIC PROFILE</text><text x="870" y="32" text-anchor="end" class="label pulse">● ONLINE</text>
<text x="30" y="68" class="title">CONNECT.SH // OPEN CHANNEL</text>
<rect class="scan" x="4" y="222" width="892" height="1" fill="#42f58d" opacity=".13"/>
<text x="48" y="111" class="value">If the work is useful, open an issue, improve the docs, or start a conversation.</text><a href="https://github.com/thorsenbuilds"><rect x="48" y="137" width="214" height="43" rx="8" fill="#10281a" stroke="#42f58d"/><text x="68" y="164" class="value accent">github.com/thorsenbuilds</text></a><text x="48" y="205" class="label">BUILDING IN PUBLIC · PYTHON · APPLIED AI · MUSIC DISCOVERY</text>
</svg>