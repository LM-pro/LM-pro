<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="Animated terminal open-source profile stats"><defs>
<linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60ff48"/><stop offset=".48" stop-color="#185d2b"/><stop offset="1" stop-color="#142c37"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09130c"/><stop offset=".55" stop-color="#060b09"/><stop offset="1" stop-color="#080c13"/></linearGradient>
<radialGradient id="haloA"><stop stop-color="#61ff36" stop-opacity=".42"/><stop offset="1" stop-color="#49ff24" stop-opacity="0"/></radialGradient>
<radialGradient id="haloB"><stop stop-color="#45c9a1" stop-opacity=".26"/><stop offset="1" stop-color="#45c9a1" stop-opacity="0"/></radialGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7dff42" stop-opacity="0"/><stop offset=".48" stop-color="#a6ff6a" stop-opacity=".64"/><stop offset="1" stop-color="#7dff42" stop-opacity="0"/></linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7bff52"/><stop offset=".55" stop-color="#3bc882"/><stop offset="1" stop-color="#54f34b"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="24"/></filter><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace} .label{fill:#78a77d;font-size:12px;letter-spacing:1.1px} .small{fill:#78a77d;font-size:11px} .value{fill:#d8ffe0;font-size:16px;font-weight:600} .accent{fill:#54f34b} .bright{fill:#b7ff63}
.glow-drift{animation:drift 8s ease-in-out infinite alternate} .scan{animation:scan 5.0s linear infinite} .pulse{animation:pulse 2.4s ease-in-out infinite} .rise{opacity:0;animation:rise .7s ease-out forwards} .dash{stroke-dasharray:650;stroke-dashoffset:650;animation:draw 2.1s ease-out forwards} .ring-pulse{transform-box:fill-box;transform-origin:center;animation:ring 4s ease-in-out infinite}
@keyframes drift{from{transform:translate(-24px,-4px);opacity:.72}to{transform:translate(22px,8px);opacity:1}} @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(320px)}} @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}} @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}} @keyframes draw{to{stroke-dashoffset:0}} @keyframes ring{0%,100%{transform:scale(.96);opacity:.82}50%{transform:scale(1.04);opacity:1}}
@media(prefers-reduced-motion:reduce){.glow-drift,.scan,.pulse,.rise,.dash,.ring-pulse{animation:none!important;opacity:1;transform:none;stroke-dashoffset:0}}</style></defs>
<rect width="860" height="300" rx="20" fill="#050907"/><ellipse class="glow-drift" cx="241" cy="0" rx="258" ry="270" fill="url(#haloA)" filter="url(#blur)"/><ellipse class="glow-drift" cx="671" cy="234" rx="224" ry="192" fill="url(#haloB)" filter="url(#blur)"/>
<rect x="1" y="1" width="858" height="298" rx="19" fill="url(#glass)" stroke="url(#frame)" stroke-opacity=".88" stroke-width="1.5"/><rect x="8" y="8" width="844" height="284" rx="15" fill="#080d0b" fill-opacity=".68" stroke="#285432" stroke-opacity=".82" stroke-width="1.25"/><circle cx="34" cy="25" r="5" fill="#ff6969"/><circle cx="52" cy="25" r="5" fill="#ffc857"/><circle cx="70" cy="25" r="5" fill="#54f34b"/><text x="430" y="29" text-anchor="middle" class="small">thorsenbuilds@github:~$ neofetch</text><rect x="34" y="49" width="792" height="221" rx="11" fill="#070a09" stroke="#202725"/><rect x="34" y="49" width="792" height="29" rx="11" fill="#171a1c"/><circle cx="51" cy="63" r="5" fill="#ff6969"/><circle cx="69" cy="63" r="5" fill="#ffc857"/><circle cx="87" cy="63" r="5" fill="#54f34b"/><text x="112" y="68" class="small">thorsenbuilds@github</text><path d="M115 75H325" stroke="#b7c0b7"/><rect x="60" y="102" width="94" height="92" rx="9" fill="#060d08" stroke="#275d32"/><text x="75" y="129" class="bright" font-size="15">+-----+</text><text x="75" y="148" class="bright" font-size="15">| o o |</text><text x="75" y="167" class="bright" font-size="15">| &gt;_ |</text><text x="75" y="186" class="bright" font-size="15">+-----+</text><text x="192" y="107" class="bright" font-size="17" font-weight="700">thorsenbuilds@github</text><g class="rise" style="animation-delay:0ms"><text x="192" y="120" class="bright" font-size="13" font-weight="700">Name</text><text x="288" y="120" class="value" font-size="13">Thorsen</text></g><g class="rise" style="animation-delay:80ms"><text x="192" y="137" class="bright" font-size="13" font-weight="700">Role</text><text x="288" y="137" class="value" font-size="13">Python developer</text></g><g class="rise" style="animation-delay:160ms"><text x="192" y="154" class="bright" font-size="13" font-weight="700">Stars</text><text x="288" y="154" class="value" font-size="13">0</text></g><g class="rise" style="animation-delay:240ms"><text x="192" y="171" class="bright" font-size="13" font-weight="700">Repos</text><text x="288" y="171" class="value" font-size="13">3</text></g><g class="rise" style="animation-delay:320ms"><text x="192" y="188" class="bright" font-size="13" font-weight="700">Followers</text><text x="288" y="188" class="value" font-size="13">0</text></g><g class="rise" style="animation-delay:400ms"><text x="192" y="205" class="bright" font-size="13" font-weight="700">Top Lang</text><text x="288" y="205" class="value" font-size="13">Python</text></g><g class="rise" style="animation-delay:480ms"><text x="192" y="222" class="bright" font-size="13" font-weight="700">Activity</text><text x="288" y="222" class="value" font-size="13">28 public contributions</text></g><rect x="192" y="244" width="22" height="11" rx="2" fill="#54f34b" class="pulse" style="animation-delay:0ms"/><rect x="219" y="244" width="22" height="11" rx="2" fill="#b4ffd3" class="pulse" style="animation-delay:130ms"/><rect x="246" y="244" width="22" height="11" rx="2" fill="#b7ff63" class="pulse" style="animation-delay:260ms"/><rect x="273" y="244" width="22" height="11" rx="2" fill="#54f34b" class="pulse" style="animation-delay:390ms"/><rect x="300" y="244" width="22" height="11" rx="2" fill="#41bd7d" class="pulse" style="animation-delay:520ms"/><rect x="327" y="244" width="22" height="11" rx="2" fill="#65db91" class="pulse" style="animation-delay:650ms"/><text x="808" y="257" text-anchor="end" class="small">PUBLIC DATA ONLY  ·  UPDATED WEEKLY</text></svg>