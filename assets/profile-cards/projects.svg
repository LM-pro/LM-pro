<svg xmlns="http://www.w3.org/2000/svg" width="860" height="274" viewBox="0 0 860 274" role="img" aria-label="Animated GitSkins-style public project cards"><defs>
<linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60ff48"/><stop offset=".48" stop-color="#185d2b"/><stop offset="1" stop-color="#142c37"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09130c"/><stop offset=".55" stop-color="#060b09"/><stop offset="1" stop-color="#080c13"/></linearGradient>
<radialGradient id="haloA"><stop stop-color="#61ff36" stop-opacity=".42"/><stop offset="1" stop-color="#49ff24" stop-opacity="0"/></radialGradient>
<radialGradient id="haloB"><stop stop-color="#45c9a1" stop-opacity=".26"/><stop offset="1" stop-color="#45c9a1" stop-opacity="0"/></radialGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7dff42" stop-opacity="0"/><stop offset=".48" stop-color="#a6ff6a" stop-opacity=".64"/><stop offset="1" stop-color="#7dff42" stop-opacity="0"/></linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7bff52"/><stop offset=".55" stop-color="#3bc882"/><stop offset="1" stop-color="#6468ff"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="24"/></filter><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace} .label{fill:#78a77d;font-size:12px;letter-spacing:1.1px} .small{fill:#78a77d;font-size:11px} .value{fill:#d8ffe0;font-size:16px;font-weight:600} .accent{fill:#54f34b} .bright{fill:#b7ff63}
.glow-drift{animation:drift 8s ease-in-out infinite alternate} .scan{animation:scan 5.0s linear infinite} .pulse{animation:pulse 2.4s ease-in-out infinite} .rise{opacity:0;animation:rise .7s ease-out forwards} .dash{stroke-dasharray:650;stroke-dashoffset:650;animation:draw 2.1s ease-out forwards} .ring-pulse{transform-box:fill-box;transform-origin:center;animation:ring 4s ease-in-out infinite}
@keyframes drift{from{transform:translate(-24px,-4px);opacity:.72}to{transform:translate(22px,8px);opacity:1}} @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(294px)}} @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}} @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}} @keyframes draw{to{stroke-dashoffset:0}} @keyframes ring{0%,100%{transform:scale(.96);opacity:.82}50%{transform:scale(1.04);opacity:1}}
@media(prefers-reduced-motion:reduce){.glow-drift,.scan,.pulse,.rise,.dash,.ring-pulse{animation:none!important;opacity:1;transform:none;stroke-dashoffset:0}}</style></defs>
<rect width="860" height="274" rx="20" fill="#050907"/><ellipse class="glow-drift" cx="241" cy="0" rx="258" ry="247" fill="url(#haloA)" filter="url(#blur)"/><ellipse class="glow-drift" cx="671" cy="214" rx="224" ry="175" fill="url(#haloB)" filter="url(#blur)"/>
<rect x="1" y="1" width="858" height="272" rx="19" fill="url(#glass)" stroke="url(#frame)" stroke-opacity=".88" stroke-width="1.5"/><rect x="12" y="12" width="836" height="250" rx="15" fill="#080d0b" fill-opacity=".68" stroke="#285432" stroke-opacity=".82" stroke-width="1.25"/><text x="52" y="49" class="label bright">PROJECTS.LIST</text><text x="226" y="49" class="small">./projects.sh --all</text><text x="808" y="49" text-anchor="end" class="small">2 PROJECTS</text><path d="M52 60H808" stroke="#315f34"/><g class="rise" style="animation-delay:0ms"><rect x="52" y="82" width="354" height="164" rx="14" fill="url(#glass)" stroke="#3a7040" stroke-width="1.3"/><rect x="53" y="83" width="352" height="31" rx="13" fill="#102515"/><path d="M53 112H405" stroke="#315d37"/><text x="68" y="103" class="small">• thorsenbuilds/missions-demo</text><circle cx="383" cy="98" r="3.8" class="pulse" fill="#b7ff63"/><text x="69" y="142" class="bright" font-size="18" font-weight="700">missions-demo <tspan class="small">_</tspan></text><text x="69" y="165" class="small">Personal Python demos with the</text><text x="69" y="180" class="small">Claude API: sample DM scoring,…</text><rect x="69" y="193" width="68" height="20" rx="10" fill="#102817" stroke="#3b8743"/><text x="103" y="207" text-anchor="middle" class="small bright">Python</text><text x="69" y="227" class="small">★ 0  ·  updated 7d ago</text><circle cx="354" cy="178" r="24" fill="none" stroke="#14261c" stroke-width="5"/><circle class="ring-pulse" cx="354" cy="178" r="24" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="100 100" transform="rotate(-90 354 178)"/><text x="354" y="182" text-anchor="middle" class="small bright" font-size="10">100%</text></g><g class="rise" style="animation-delay:180ms"><rect x="426" y="82" width="354" height="164" rx="14" fill="url(#glass)" stroke="#3a7040" stroke-width="1.3"/><rect x="427" y="83" width="352" height="31" rx="13" fill="#102515"/><path d="M427 112H779" stroke="#315d37"/><text x="442" y="103" class="small">• thorsenbuilds/harmonix</text><circle cx="757" cy="98" r="3.8" class="pulse" fill="#b7ff63"/><text x="443" y="142" class="bright" font-size="18" font-weight="700">harmonix <tspan class="small">_</tspan></text><text x="443" y="165" class="small">Reordonnancement harmonique de</text><text x="443" y="180" class="small">playlist Spotify : tonalite…</text><rect x="443" y="193" width="68" height="20" rx="10" fill="#102817" stroke="#3b8743"/><text x="477" y="207" text-anchor="middle" class="small bright">Python</text><text x="443" y="227" class="small">★ 0  ·  updated 2mo ago</text><circle cx="728" cy="178" r="24" fill="none" stroke="#14261c" stroke-width="5"/><circle class="ring-pulse" cx="728" cy="178" r="24" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="100 100" transform="rotate(-90 728 178)"/><text x="728" y="182" text-anchor="middle" class="small bright" font-size="10">100%</text></g></svg>